# Compila Prisma Sonoro su GitHub a ogni aggiornamento del ramo main:
#  - Mac: VST3 + AU + app, binario universale (Apple Silicon e Intel), firma ad hoc, controllo con pluginval
#  - Windows: VST3 + app (x64)
# I file pronti vengono pubblicati nella pagina "Releases" del repository: non serve scaricare i sorgenti.
name: Build Mac e Windows

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: macOS universale
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configura
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Compila
        run: cmake --build build --config Release --target PrismaSonoro_VST3 PrismaSonoro_AU PrismaSonoro_Standalone -- -quiet
      - name: Firma ad hoc e comprimi
        run: |
          cd "build/PrismaSonoro_artefacts/Release"
          codesign --force --deep -s - "VST3/Prisma Sonoro.vst3"
          codesign --force --deep -s - "AU/Prisma Sonoro.component"
          codesign --force --deep -s - "Standalone/Prisma Sonoro.app"
          ditto -c -k --keepParent "VST3/Prisma Sonoro.vst3"      "PrismaSonoro-VST3-mac.zip"
          ditto -c -k --keepParent "AU/Prisma Sonoro.component"   "PrismaSonoro-AU-mac.zip"
          ditto -c -k --keepParent "Standalone/Prisma Sonoro.app" "PrismaSonoro-App-mac.zip"
      - name: Controllo con pluginval
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pv.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process --skip-gui-tests "build/PrismaSonoro_artefacts/Release/VST3/Prisma Sonoro.vst3"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: build/PrismaSonoro_artefacts/Release/*.zip

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configura
        run: cmake -S . -B build -A x64
      - name: Compila
        run: cmake --build build --config Release --target PrismaSonoro_VST3 PrismaSonoro_Standalone
      - name: Comprimi
        shell: pwsh
        run: |
          $r = "build/PrismaSonoro_artefacts/Release"
          Compress-Archive -Path "$r/VST3/Prisma Sonoro.vst3" -DestinationPath "PrismaSonoro-VST3-win.zip"
          Compress-Archive -Path "$r/Standalone/Prisma Sonoro.exe" -DestinationPath "PrismaSonoro-App-win.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "*.zip"

  release:
    name: Pubblica in Releases
    if: github.ref == 'refs/heads/main'
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Prisma Sonoro 1.0.${{ github.run_number }}
          body: |
            Compilato automaticamente da GitHub dal commit ${{ github.sha }}.

            **Mac** (Apple Silicon e Intel, macOS 11 o successivo)
            - PrismaSonoro-VST3-mac.zip: estrai e copia in ~/Library/Audio/Plug-Ins/VST3/
            - PrismaSonoro-AU-mac.zip: estrai e copia in ~/Library/Audio/Plug-Ins/Components/
            - PrismaSonoro-App-mac.zip: versione autonoma, va in Applicazioni
            Il plugin non è firmato da Apple: dopo averlo copiato, nel Terminale
            `xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/"Prisma Sonoro.vst3" ~/Library/Audio/Plug-Ins/Components/"Prisma Sonoro.component" /Applications/"Prisma Sonoro.app"`

            **Windows** (64 bit)
            - PrismaSonoro-VST3-win.zip: estrai e copia la cartella "Prisma Sonoro.vst3" in C:\Program Files\Common Files\VST3\
            - PrismaSonoro-App-win.zip: versione autonoma (Prisma Sonoro.exe)
          files: dist/*.zip
